<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e3a8a;#0e7490;#0f172a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0e7490">
        <animate attributeName="stop-color" values="#0e7490;#0f172a;#1e3a8a;#0e7490" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="220" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <!-- olas en movimiento dentro del rectángulo -->
    <path fill="#06b6d4" fill-opacity="0.18" d="M0 170 Q150 140 300 170 T600 170 T900 170 T1200 170 T1500 170 T1800 170 T2100 170 T2400 170 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path fill="#38bdf8" fill-opacity="0.12" d="M0 185 Q150 210 300 185 T600 185 T900 185 T1200 185 T1500 185 T1800 185 T2100 185 T2400 185 V220 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <!-- partículas -->
    <g fill="#ffffff">
      <circle cx="90" cy="40" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="90" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="50" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="110" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="35" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
      <text x="600" y="100" font-size="54" font-weight="700">Orlando Zarraga
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="600" y="145" font-size="22" fill="#a5f3fc">Backend / Full Stack Developer
        <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
